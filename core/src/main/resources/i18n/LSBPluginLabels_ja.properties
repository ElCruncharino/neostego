######## Resource bundle for labels used by LSB Plugin ########
######## (Japanese)

plugin.description = 色データの最下位ビットを使用する画像用ステガノグラフィプラグイン

# Error messages
err.image.read = 画像データの読み込み中にエラーが発生しました。
err.image.arg.nullValue = 画像の値は「Null」です。
err.image.insufficientSize = 画像サイズがデータを埋め込むために不足しています。

err.invalidHeaderStamp = 埋め込まれたデータは壊れている、または入力されたパスワードは無効である、またはステゴファイルを扱うアルゴリズムは存在しません。
err.invalidHeaderVersion = データは現在サポートされていないNeoStegoの古いバージョンを使用して埋め込まれています。

err.config.maxBitsUsedPerChannel.notNumber = 設定項目「maxBitsUsedPerChannel」の値は無効です：{0}
err.config.maxBitsUsedPerChannel.notInRange = 設定項目「maxBitsUsedPerChannel」の値は1から8の間である必要があります。入力された値：{0}

# Labels for command line interface
plugin.usage = NeoStego用色データの最下位ビット「LSB」アルゴリズム\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
NeoStego用LSBアルゴリズム特定のオプション：\n\
\n\
「embed」コマンドのオプション：\n\
\n\
\    -b, --maxBitsUsedPerChannel <数>\n\
\        データを埋め込む際に画像の各色チャンネルで使用する最大ビット数。\n\
\        画像のサイズがデータを格納するのに不足している場合、画質を\n\
\        犠牲にしてこの値を増やすことができます（デフォルト \= {0}）\n\
\n\
\  これは既存のNeoStegoオプションにも次のように影響します：\n\
\n\
\    -cf, --coverfile <ファイル名>\n\
\        このオプションを指定しないか、値として''-''（引用符なし）を指定した\n\
\        場合、ノイズを含むランダムな画像が生成され、カバーファイルとして\n\
\        使用されます。画像のサイズは、''maxBitsUsedPerChannel''ビットを\n\
\        各色チャンネルで使用した場合に、指定されたソースファイルを埋め込む\n\
\        ために必要な最小サイズになります\n\
\n\
\    -sf, --stegofile <ファイル名>\n\
\        このオプションを指定しないか、値として''-''（引用符なし）を指定した\n\
\        場合、ステゴファイルは標準出力にPNG形式で書き込まれます

# Labels for GUI
gui.label.option.useRandomImage = ランダムなノイズ画像をカバーファイルとする
gui.label.option.maxBitsPerChannel = 各色チャンネルに最大使用するビット
gui.label.option.advanced = 詳細オプション
