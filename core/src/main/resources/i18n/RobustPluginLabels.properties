######## Resource bundle for labels used by the Robust (DWT-SVD-QIM) data-hiding plugin ########

plugin.description = Robust data hiding that survives JPEG re-compression, noise, blur and mild scaling/cropping

# Error messages
err.cover.missing = Cover file is not provided
err.file.too.small = Image is too small to embed the message
err.message.too.long = Message is too long for the fixed robust-mode capacity
err.decode.failed = Could not recover a message (wrong password, no message embedded, or damage beyond repair)

# Labels for command line interface
plugin.usage = Robust data-hiding plugin (DWT-SVD-QIM) for NeoStego.\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
This plugin embeds a short message (up to {0} bytes, header included) by quantizing the\n\
largest singular value of 8x8 blocks of the level-1 DWT approximation sub-band. Protected\n\
with Reed-Solomon error correction and spread across the image, the message survives JPEG\n\
re-compression, noise, blurring, mild scaling, and small crops/translations.
