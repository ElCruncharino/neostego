######## Resource bundle for labels used by the WAV LSB audio plugin ########
######## (Japanese)

plugin.description = WAV（PCM）サンプルの最下位ビットにデータを隠す音声用ステガノグラフィプラグイン

# Labels for command line interface
plugin.usage = NeoStego用WAV LSB（WavLSB）音声プラグイン。\n\
Copyright (c) @time.year@ @author.name@\n\
\n\
非圧縮WAVカバーファイルの各整数PCMサンプルの最下位ビットにメッセージを隠します。\n\
出力は同じ形式のWAVであり、ファイルは通常どおり再生できます。対応している\n\
のは非圧縮のPCM WAVのみで、非可逆圧縮の音声（MP3、AAC、Oggなど）は、\n\
メッセージが存在する下位ビットの詳細をコーデックが破棄してしまうため、\n\
隠しデータを運ぶことができません。圧縮と暗号化のオプションは、画像プラグイン\n\
の場合と同様に動作します。\n\
\n\
\    -cf, --coverfile <filename.wav>\n\
\        メッセージを埋め込む対象となるWAVカバーファイル。\n\
\    -sf, --stegofile <filename.wav>\n\
\        隠しメッセージを含む出力WAV。

# Error messages
err.audio.insufficientSize = WAVカバーファイルが小さすぎてデータを保持できません。より長い音声クリップ、または小さい（もしくは圧縮された）ペイロードを使用してください。
err.audio.invalidWav = 無効または未対応の音声ファイルです：RIFF/WAVEコンテナではありません
err.audio.unsupportedFormat = 未対応のWAV形式です：非圧縮の整数PCMのみサポートされています
err.audio.noCoverFile = 埋め込みにはWAVカバーファイルが必要です
err.audio.read = 音声ファイルから埋め込まれたデータを読み込み中にエラーが発生しました
