######## Resource bundle for labels of the F5 JPEG plugin ########
######## (Japanese)

plugin.description = F5 JPEGステガノグラフィ（Westfeld, 2001）。Secret Space Encryptorから移植。既にJPEGとして圧縮された載体に直接埋め込む方式で、パスワードで種付けされたBlake2b擬似乱数生成器を用いて量子化されたDCT係数を並べ替え、(1,n,k)行列符号化で各ビットを最小限の係数変更で隠し、常に大きさをゼロに向けて縮小する。高速で実績のある手法だが、非適応型の固定エンコーダーであるためSI-UNIWARDより検出されやすい。JPEG載体への小さなペイロードの埋め込みに向いている。

err.image.read = 埋め込まれたデータの読み込み中にエラーが発生しました
err.image.insufficientSize = 画像サイズがデータを埋め込むために不足しています
err.jpeg.invalid = 不正または未対応のJPEGストリームです
err.cover.required = F5にはJPEG形式の載体画像が必要です

plugin.usage = NeoStego用F5（F5）プラグイン。\n\
\n\
\  既存のJPEG載体を取り込み、古典的なF5アルゴリズム（行列符号化とパスワード\n\
\  種付けされた並べ替え）を用いて、その量子化されたDCT係数にデータを隠します。\n\
\  載体JPEG自身の量子化テーブルが再エンコード時にそのまま再利用されるため、\n\
\  品質オプションはありません。容量は載体の非ゼロAC係数の数に依存し、F5は\n\
\  固定エンコーダーであるためSI-UNIWARDプラグインより秘匿性は劣りますが、\n\
\  高速であり、圧縮済みJPEGしか載体として用意できない場合の小さなペイロード\n\
\  に適しています。
