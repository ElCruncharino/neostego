# Detailed hover descriptions for each algorithm (HTML, shown as tooltips on the dropdown)
gui.tooltip.dhEmbed.algo.JpegUniward = <html><b>SI-UNIWARD（JPEG）</b><br>JPEG係数にデータを隠すコンテンツ適応型の埋め込み方式で、変更をノイズが多くモデル化しにくい領域に集中させます。<br><br><b>フォーマット：</b>JPEG &nbsp; <b>容量：</b>低 &nbsp; <b>検出されにくさ：</b>最高<br><i>秘匿性が最も重要で、ペイロードが小さい場合に最適です。</i></html>
gui.tooltip.dhEmbed.algo.Adaptive = <html><b>Adaptive（PNG）</b><br>変化が激しく高分散な画素に埋め込みを誘導することで検出を困難にしつつ、出力を可逆に保ちます。<br><br><b>フォーマット：</b>PNG &nbsp; <b>容量：</b>中程度 &nbsp; <b>検出されにくさ：</b>高<br><i>可逆方式の中で最も安全な、強力な汎用デフォルトです。</i></html>
gui.tooltip.dhEmbed.algo.RandomLSBMatch = <html><b>LSBマッチング（PNG）</b><br>最下位ビットを上書きするのではなく値を増減させることでペイロードを画素全体にランダムに分散させ、通常のLSBより検出が困難です。<br><br><b>フォーマット：</b>PNG &nbsp; <b>容量：</b>高 &nbsp; <b>検出されにくさ：</b>中程度<br><i>容量と秘匿性のバランスが良好です。</i></html>
gui.tooltip.dhEmbed.algo.RandomLSB = <html><b>ランダムLSB（PNG）</b><br>パスワードをシードとした画像内の疑似ランダムな位置で最下位ビットを上書きします。<br><br><b>フォーマット：</b>PNG &nbsp; <b>容量：</b>高 &nbsp; <b>検出されにくさ：</b>低<br><i>大きなペイロードを収める必要があり、検出されにくさをあまり気にしない場合に使用してください。</i></html>
gui.tooltip.dhEmbed.algo.LSB = <html><b>LSB（PNG）</b><br>古典的な逐次最下位ビット埋め込み方式です。シンプルで容量は大きいですが、最も検出されやすい方式です。<br><br><b>フォーマット：</b>PNG &nbsp; <b>容量：</b>最高 &nbsp; <b>検出されにくさ：</b>最低<br><i>レガシー／互換性のためのオプションです。真の秘匿性が必要な場合は他の方式を選んでください。</i></html>
gui.tooltip.dhEmbed.algo.WavLSB = <html><b>WAV LSB（オーディオ）</b><br>非圧縮WAVの各整数PCMサンプルの最下位ビットにデータを隠します。出力は同じ形式のWAVで、通常どおり再生できます。<br><br><b>フォーマット：</b>WAV（可逆PCM） &nbsp; <b>容量：</b>高 &nbsp; <b>検出されにくさ：</b>低<br><i>オーディオにデータを隠す場合に使用します。非可逆フォーマット（MP3、AAC）はLSBデータを保持できません。</i></html>
