# Labels for command line interface
cmd.usage = @app.name@は、次の2つの機能を提供するステガノグラフィアプリケーションです：\n\
\  1. データ隠蔽：任意のデータを画像ファイル内に隠すことができます。\n\
\  2. 電子透かし：目に見えない署名で画像ファイルに電子透かしを入れます。\n\
\     これにより、無断でのファイル複製を検出できます。\n\
\n\
GUIの場合：\n\
\  neostego\n\
\n\
コマンドラインインターフェースの場合：\n\
\  neostego <command> [options]\n\
\n\
最初の引数はコマンドである必要があります。有効なコマンドは次のとおりです：\n\
\n\
\  embed, --embed                メッセージをカバーファイルに埋め込む\n\
\  extract, --extract            ステゴファイルからメッセージを抽出する\n\
\  gensig, --gensig              電子透かし用の署名を生成する\n\
\  embedmark, --embedmark        署名を使ってカバーファイルに電子透かしを入れる\n\
\  checkmark, --checkmark        ファイルに電子透かしが存在するか確認する\n\
\  algorithms, --algorithms      サポートされているステガノグラフィアルゴリズム\n\
\                                の一覧を表示する\n\
\  readformats --readformats     カバーファイルとしてサポートされている\n\
\                                フォーマットの一覧を表示する\n\
\  writeformats, --writeformats  ステゴファイルとしてサポートされている\n\
\                                フォーマットの一覧を表示する\n\
\  help, --help                  このヘルプを表示する。特定のアルゴリズムの\n\
\                                オプションに関するヘルプを表示するには、\n\
\                                ''-a''オプションでアルゴリズム名を指定して\n\
\                                ください\n\
\n\
''algorithms''以外のすべてのコマンドに共通のオプション：\n\
\n\
\    -a, --algorithm <algorithm_name>\n\
\        使用するステガノグラフィアルゴリズムの名前。サポートされている\n\
\        アルゴリズムの一覧は''algorithms''コマンドで取得できます\n\
\n\
''embed''のオプション：\n\
\n\
\    -mf, --messagefile <filename>\n\
\        埋め込むメッセージ／データの元となるファイル。このオプションを\n\
\        指定しない場合、または値として''-''（引用符なし）を指定した場合、\n\
\        メッセージデータは標準入力から読み込まれます\n\
\n\
\    -cf, --coverfile <filename>\n\
\        メッセージを埋め込むカバーファイル。このオプションはファイル名に\n\
\        ''*''と''?''のワイルドカードを使用できます。ワイルドカードを含む\n\
\        ファイル名を指定する場合は、必ず二重引用符で囲んでください。\n\
\        複数のファイル名を'';''（セミコロン）で区切って指定することも\n\
\        できます。\n\
\        ワイルドカード式が複数のファイルにマッチした場合、''-sf''\n\
\        オプションは無視され、各カバーファイルは対応して生成された\n\
\        ステゴファイルで上書きされます\n\
\n\
\    -sf, --stegofile <filename>\n\
\        埋め込まれたメッセージを含む出力ステゴファイル。このオプションを\n\
\        指定しない場合、または値として''-''（引用符なし）を指定した場合、\n\
\        ステゴファイルは標準出力に書き込まれます\n\
\n\
\    -c, --compress\n\
\        埋め込み前にメッセージファイルを圧縮する（デフォルト）\n\
\n\
\    -C, --nocompress\n\
\        埋め込み前にメッセージファイルを圧縮しない\n\
\n\
\    -e, --encrypt\n\
\        埋め込み前にメッセージファイルを暗号化する\n\
\n\
\    -E, --noencrypt\n\
\        埋め込み前にメッセージファイルを暗号化しない（デフォルト）\n\
\n\
\    -p, --password <password>\n\
\        暗号化に使用するパスワード。指定しない場合、入力用のプロンプトが\n\
\        表示されます\n\
\n\
\    -A, --cryptalgo <crypto algorithm>\n\
\        暗号化に使用するアルゴリズム。デフォルトはAES128です。指定できる\n\
\        値はAES128またはAES256です。AES256は、無制限強度の管轄ポリシーを\n\
\        持つJREでのみサポートされることに注意してください\n\
\n\
\    -S, --split\n\
\        同じメッセージを各カバーファイルに埋め込むのではなく、1つの\n\
\        メッセージを指定したすべてのカバーファイルに分割して埋め込みます。\n\
\        ''-cf''で少なくとも2つのカバーファイルを（'';''区切りで）指定し、\n\
\        ''-sf''にはディレクトリを指定してください。カバーファイルごとに1つの\n\
\        ステゴファイルがそこに書き出されます。抽出時は対応する''-S''\n\
\        オプションを使用してください\n\
\n\
''extract''のオプション：\n\
\n\
\    -sf, --stegofile <filename>\n\
\        埋め込まれたメッセージを含むステゴファイル。''-S''（分割）を\n\
\        使用する場合は、すべてのステゴパートを'';''区切りで指定します\n\
\n\
\    -S, --split\n\
\        ''embed -S''オプションで複数のカバーファイルに分割して埋め込まれたメッセージ\n\
\        を再結合します。''-sf''ですべてのステゴパートを（'';''区切りで）\n\
\        列挙してください\n\
\n\
\    -xf, --extractfile <filename>\n\
\        抽出されたデータの任意のファイル名。ステゴファイルに埋め込まれた\n\
\        ファイル名を上書きする場合に使用します\n\
\n\
\    -xd, --extractdir <dir>\n\
\        メッセージファイルが抽出されるディレクトリ。このオプションを\n\
\        指定しない場合、ファイルはカレントディレクトリに抽出されます\n\
\n\
\    -p, --password <password>\n\
\        復号に使用するパスワード。指定しない場合（メッセージが暗号化\n\
\        されているときは）、入力用のプロンプトが表示されます\n\
\n\
''gensig''のオプション：\n\
\n\
\    -gf, --sigfile <filename>\n\
\        ファイルに電子透かしを入れるために使用できる出力署名ファイル。\n\
\        このオプションを指定しない場合、または値として''-''（引用符なし）\n\
\        を指定した場合、署名ファイルは標準出力に書き込まれます\n\
\n\
\    -p, --password <password>\n\
\        署名の生成に使用するパスワード。指定しない場合、入力用の\n\
\        プロンプトが表示されます\n\
\n\
''embedmark''のオプション：\n\
\n\
\    -gf, --sigfile <filename>\n\
\        電子透かし用の署名ファイル。このオプションを指定しない場合、\n\
\        または値として''-''（引用符なし）を指定した場合、署名データは\n\
\        標準入力から読み込まれます\n\
\n\
\    -cf, --coverfile <filename>\n\
\        電子透かしを入れるカバーファイル。このオプションはファイル名に\n\
\        ''*''と''?''のワイルドカードを使用できます。ワイルドカードを含む\n\
\        ファイル名を指定する場合は、必ず二重引用符で囲んでください。\n\
\        複数のファイル名を'';''（セミコロン）で区切って指定することも\n\
\        できます。\n\
\        ワイルドカード式が複数のファイルにマッチした場合、''-sf''\n\
\        オプションは無視され、各カバーファイルは対応して生成された\n\
\        ステゴファイルで上書きされます\n\
\n\
\    -sf, --stegofile <filename>\n\
\        埋め込まれた電子透かしを含む出力ステゴファイル。このオプションを\n\
\        指定しない場合、または値として''-''（引用符なし）を指定した場合、\n\
\        ステゴファイルは標準出力に書き込まれます\n\
\n\
''checkmark''のオプション：\n\
\n\
\    -sf, --stegofile <filename>\n\
\        埋め込まれた電子透かしを含むステゴファイル\n\
\n\
\    -gf, --sigfile <filename>\n\
\        ファイルに電子透かしを入れる際に使用した署名ファイル\n\
\n\
例：\n\
\n\
\  secret.txtをwallpaper.pngに埋め込み、test.pngを出力する場合：\n\
\n\
\      neostego embed -a RandomLSB -mf secret.txt \\\n\
\        -cf wallpaper.png -sf test.png\n\
\   または\n\
\      neostego --embed --algorithm=RandomLSB \\\n\
\        --messagefile=secret.txt --coverfile=wallpaper.png --stegofile=test.png\n\
\n\
\  test.pngから埋め込まれたデータを/dataディレクトリに抽出する場合：\n\
\n\
\      neostego extract -a RandomLSB -sf test.png -xd /data\n\
\   または\n\
\      neostego extract --algorithm=RandomLSB \\\n\
\        --stegofile=test.png --extractdir=/data\n\
\n\
\  署名ファイルを生成する場合：\n\
\n\
\      neostego gensig -a DWTSVD -gf my.sig\n\
\   または\n\
\      neostego --gensig --algorithm=DWTSVD \\\n\
\        --sigfile=my.sig\n\
\n\
\  owned.pngに署名を埋め込み、out.pngを出力する場合：\n\
\n\
\      neostego embedmark -a DWTSVD -gf my.sig \\\n\
\        -cf owned.png -sf out.png\n\
\   または\n\
\      neostego --embedmark --algorithm=DWTSVD \\\n\
\        --sigfile=my.sig --coverfile=owned.png --stegofile=out.png\n\
\n\
\  my.sig署名ファイルを使ってtest.pngの電子透かしを確認する場合：\n\
\n\
\      neostego checkmark -a DWTSVD -gf my.sig \\\n\
\        -sf test.png\n\
\   または\n\
\      neostego checkmark --algorithm=DWTSVD \\\n\
\        --sigfile=my.sig --stegofile=test.png\n\
\n\
\  パイプの例：\n\
\n\
\      ls -R | neostego embed -a RandomLSB > test.png\n\
\n\
\  ワイルドカードの例（二重引用符が重要である点に注意してください）：\n\
\n\
\      neostego embed -a RandomLSB \\\n\
\        -cf \"img???.png;wall*.png\" -mf watermark.txt

