######## Resource bundle for labels of the F5 JPEG plugin ########
######## (Chinese Simplified)

plugin.description = F5 JPEG 隐写术（Westfeld, 2001），移植自 Secret Space Encryptor。直接嵌入到已压缩的 JPEG 载体中：使用密码作为种子的 Blake2b 伪随机数生成器打乱量化后的 DCT 系数，并用 (1,n,k) 矩阵编码以最小的系数改动隐藏每一位，且改动始终使系数幅值趋向于零。速度快、成熟可靠，但属于固定（非自适应）编码器，因此比 SI-UNIWARD 更易被检测；适合在 JPEG 载体上嵌入较小的载荷。

err.image.read = 读取嵌入数据时出错
err.image.insufficientSize = 图像尺寸不足以嵌入数据
err.jpeg.invalid = JPEG 数据流格式错误或不受支持
err.cover.required = F5 需要 JPEG 格式的载体图像

plugin.usage = NeoStego F5（F5）插件。\n\
\n\
\  接收一个现有的 JPEG 载体，使用经典的 F5 算法（矩阵编码 + 密码种子打乱）\n\
\  将数据隐藏在其量化后的 DCT 系数中。重新编码时会复用载体 JPEG 自身的\n\
\  量化表，因此没有质量选项。容量取决于载体中非零 AC 系数的数量；F5 是\n\
\  固定编码器，隐蔽性不如 SI-UNIWARD 插件，但速度快，适合仅有压缩 JPEG\n\
\  可用作载体、且载荷较小的场景。
