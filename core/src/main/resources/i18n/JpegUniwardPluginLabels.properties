######## Resource bundle for labels of the SI-UNIWARD JPEG plugin ########

plugin.description = Side-Informed UNIWARD (SI-UNIWARD) JPEG steganography. Compresses an uncompressed precover (PNG/BMP) to JPEG itself, using the quantization rounding errors as side information to steer minimal, STC-coded +/-1 DCT changes into wavelet-textured regions. The consensus most-secure practical JPEG scheme; strongly resists modern DCT-domain steganalysis.

err.image.read = Error reading the embedded data
err.image.insufficientSize = Image size not enough to embed the data
err.jpeg.invalid = Malformed or unsupported JPEG stream
err.cover.required = Plain J-UNIWARD mode requires a JPEG cover image

plugin.usage = SI-UNIWARD (JpegUniward) Plugin for NeoStego.\n\
\n\
\  Takes an uncompressed precover (PNG/BMP) and writes a JPEG, hiding data in the\n\
\  DCT coefficients. The plugin owns the JPEG compression, so it knows each\n\
\  coefficient's rounding error and rounds the cheaper way (side information),\n\
\  placing STC-coded +/-1 changes where they disturb the wavelet content least.\n\
\  Capacity is lower than plain LSB because the payload is spread thinly for\n\
\  security. Output quality defaults to 90 and can be set with the quality option\n\
\  or the NEOSTEGO_JPEG_QUALITY environment variable.

# Labels for GUI
gui.label.option.quality = JPEG quality (50-100)
