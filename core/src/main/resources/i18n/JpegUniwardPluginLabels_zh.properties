######## Resource bundle for labels of the SI-UNIWARD JPEG plugin ########
######## (Chinese Simplified)

plugin.description = 边信息 UNIWARD（SI-UNIWARD）JPEG 隐写术。将未压缩的预载体（PNG/BMP）自行压缩为 JPEG，并利用量化舍入误差作为边信息，引导经 STC 编码的最小 ±1 DCT 改动集中到小波纹理复杂的区域。是公认最安全的实用 JPEG 隐写方案，能有力抵御现代 DCT 域隐写分析。

err.image.read = 读取嵌入数据时出错
err.image.insufficientSize = 图像尺寸不足以嵌入数据
err.jpeg.invalid = JPEG 数据流格式错误或不受支持
err.cover.required = 纯 J-UNIWARD 模式需要 JPEG 格式的载体图像

plugin.usage = NeoStego SI-UNIWARD（JpegUniward）插件。\n\
\n\
\  接收未压缩的预载体（PNG/BMP）并写出 JPEG，将数据隐藏在 DCT 系数中。\n\
\  由于压缩过程由插件本身完成，它能知晓每个系数的舍入误差（边信息），\n\
\  并选择代价更低的舍入方向，把经 STC 编码的 ±1 改动放在对小波内容\n\
\  扰动最小的位置。为了安全起见，载荷被稀疏分散，因此容量低于普通 LSB。\n\
\  输出质量默认为 90，可通过 quality 选项或 NEOSTEGO_JPEG_QUALITY\n\
\  环境变量设置。

# Labels for GUI
gui.label.option.quality = JPEG 质量（50-100）
gui.label.option.useUerd = 使用 UERD（比 UNIWARD 更快，安全性略低）
