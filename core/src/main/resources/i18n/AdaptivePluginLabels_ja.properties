######## Resource bundle for labels of the content-adaptive (HILL+STC) plugin ########
######## (Japanese)

plugin.description = HILLコスト関数とシンドローム・トレリス符号（STC）を使用したコンテンツ適応型（Content-adaptive）画像ステガノグラフィ。テクスチャの多い領域に最小限の±1変更を集中させることで、統計的解析とAIベースの解析の両方に強く耐性を持つ。

err.image.read = 画像データの読み込み中にエラーが発生しました
err.image.insufficientSize = 画像サイズがデータを埋め込むために不足しています

plugin.usage = NeoStego用コンテンツ適応型（Adaptive）プラグイン。\n\
\n\
\  HILLコストに基づき、STC符号化された±1埋め込みでデータを隠します。変更は\n\
\  画像内の最も複雑で検出が難しい部分に配置され、最小限のサンプルでペイロード\n\
\  を運ぶよう符号化されます。セキュリティのためペイロードを薄く分散させるため、\n\
\  通常のLSBより埋め込み容量は低くなります。このアルゴリズムに追加のオプション\n\
\  はありません。

# Labels for GUI
gui.label.option.advanced = 詳細オプション
gui.label.option.cmd = 変更のクラスタリング（CMD）
gui.label.option.cmdMu = クラスタリング強度（mu）
