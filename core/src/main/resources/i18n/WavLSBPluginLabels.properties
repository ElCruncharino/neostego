######## Resource bundle for labels used by the WAV LSB audio plugin ########

plugin.description = Audio steganography plugin hiding data in the LSBs of WAV (PCM) samples

# Labels for command line interface
plugin.usage = WAV LSB (WavLSB) audio plugin for NeoStego.\n\
Copyright (c) @time.year@ @author.name@\n\
\n\
Hides a message in the least-significant bit of each integer PCM sample of an\n\
uncompressed WAV cover. Output is a WAV with the same format; the file still\n\
plays normally. Only lossless PCM WAV is supported - lossy/compressed audio\n\
(MP3, AAC, Ogg, ...) cannot carry hidden data, because the codec discards the\n\
low-order detail the message lives in. Compression and encryption options work\n\
the same as for the image plugins.\n\
\n\
\    -cf, --coverfile <filename.wav>\n\
\        WAV cover into which the message is embedded.\n\
\    -sf, --stegofile <filename.wav>\n\
\        Output WAV carrying the hidden message.

# Error messages
err.audio.insufficientSize = The WAV cover is too small to hold the data. Use a longer audio clip or a smaller (or compressed) payload.
err.audio.invalidWav = Invalid or unsupported audio file: not a RIFF/WAVE container
err.audio.unsupportedFormat = Unsupported WAV format: only uncompressed integer PCM is supported
err.audio.noCoverFile = A cover WAV file is required for embedding
err.audio.read = Error reading the embedded data from the audio file
