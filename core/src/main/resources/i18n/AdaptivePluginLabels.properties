######## Resource bundle for labels of the content-adaptive (HILL+STC) plugin ########

plugin.description = Content-adaptive image steganography using the HILL cost function with Syndrome-Trellis Codes (STC). Concentrates a minimal number of +/-1 changes in textured regions, strongly resisting both statistical and learning-based steganalysis.

err.image.read = Error reading the image data
err.image.insufficientSize = Image size not enough to embed the data

plugin.usage = Content-adaptive (Adaptive) Plugin for NeoStego.\n\
\n\
\  Hides data using HILL-cost-guided, STC-coded +/-1 embedding. Changes are\n\
\  placed in the busiest, hardest-to-detect parts of the image and coded so the\n\
\  fewest samples carry the payload. Capacity is lower than plain LSB because the\n\
\  payload is spread thinly for security. This algorithm has no extra options.

# Labels for GUI
gui.label.option.advanced = Advanced options
gui.label.option.cmd = Cluster changes (CMD)
gui.label.option.cmdMu = Clustering strength (mu)
