######## Resource bundle for labels of the SI-UNIWARD JPEG plugin ########
######## (Japanese)

plugin.description = サイド情報付きUNIWARD（SI-UNIWARD）JPEGステガノグラフィ。非圧縮のプリカバー（PNG/BMP）自身をJPEGに圧縮し、その量子化丸め誤差をサイド情報として利用することで、STC符号化された最小限の±1のDCT変更をウェーブレット的にテクスチャの多い領域へ誘導する。実用的なJPEG方式の中で最も安全とされ、現代のDCT領域ステガナリシスに強く耐性を持つ。

err.image.read = 埋め込まれたデータの読み込み中にエラーが発生しました
err.image.insufficientSize = 画像サイズがデータを埋め込むために不足しています
err.jpeg.invalid = 不正または未対応のJPEGストリームです
err.cover.required = プレーンJ-UNIWARDモードにはJPEG形式のカバー画像が必要です

plugin.usage = NeoStego用SI-UNIWARD（JpegUniward）プラグイン。\n\
\n\
\  非圧縮のプリカバー（PNG/BMP）を受け取り、そのDCT係数にデータを隠しながら\n\
\  JPEGとして書き出します。このプラグインがJPEG圧縮自体を担うため、各係数の\n\
\  丸め誤差（サイド情報）を把握でき、より安価な方向に丸めることで、STC符号化\n\
\  された±1変更をウェーブレット内容が最も乱れにくい位置に配置します。\n\
\  セキュリティのためペイロードを薄く分散させるため、通常のLSBより埋め込み\n\
\  容量は低くなります。出力品質は既定で90であり、qualityオプションまたは\n\
\  NEOSTEGO_JPEG_QUALITY環境変数で設定できます。

# Labels for GUI
gui.label.option.quality = JPEG品質（50〜100）
