######## Resource bundle for labels used by LSB Plugin ########
######## (Chinese Simplified)

plugin.description = 使用最低有效位（LSB）算法的图像隐写插件

# Error messages
err.image.read = 读取图像数据时出错
err.image.arg.nullValue = 提供的图像值为 Null
err.image.insufficientSize = 图像尺寸不足以嵌入数据

err.invalidHeaderStamp = 嵌入的数据已损坏，或提供的密码无效，或找不到能处理该隐写文件的算法
err.invalidHeaderVersion = 数据是使用旧版本的 NeoStego 嵌入的，现已不受支持

err.config.maxBitsUsedPerChannel.notNumber = 配置项 ''maxBitsUsedPerChannel'' 的值无效\: {0}
err.config.maxBitsUsedPerChannel.notInRange = 配置项 ''maxBitsUsedPerChannel'' 必须介于 1 到 8 之间。提供的值\: {0}

# Labels for command line interface
plugin.usage = NeoStego 最低有效位（LSB）插件。\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
NeoStego 的 LSB 插件专属选项：\n\
\n\
''embed'' 选项：\n\
\n\
\    -b, --maxBitsUsedPerChannel <n>\n\
\        嵌入数据时图像每个颜色通道最多使用的位数。当图像大小不足以容纳\n\
\        数据时，可以增大该值，但会牺牲图像质量（默认 \= {0}）\n\
\n\
\  它还会以如下方式影响现有的 NeoStego 选项：\n\
\n\
\    -cf, --coverfile <filename>\n\
\        如果未提供此选项，或提供的值为 ''-''（不含引号），则会生成一张\n\
\        包含噪声的随机图像并用作载体文件。当每个颜色通道使用\n\
\        ''maxBitsUsedPerChannel'' 位时，图像大小取嵌入所给源文件所需的\n\
\        最小尺寸\n\
\n\
\    -sf, --stegofile <filename>\n\
\        如果未提供此选项，或提供的值为 ''-''（不含引号），则隐写文件会\n\
\        以 PNG 格式写入标准输出

# Labels for GUI
gui.label.option.useRandomImage = 使用随机图像作为来源（载体文件）
gui.label.option.maxBitsPerChannel = 每个颜色通道最多使用的位数
gui.label.option.advanced = 高级选项
