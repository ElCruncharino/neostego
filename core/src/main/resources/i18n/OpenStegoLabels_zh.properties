# Detailed hover descriptions for each algorithm (HTML, shown as tooltips on the dropdown)
gui.tooltip.dhEmbed.algo.JpegUniward = <html><b>SI-UNIWARD（JPEG）</b><br>内容自适应嵌入算法，将数据隐藏在 JPEG 系数中，把改动集中在噪声多、难以建模的区域。<br><br><b>格式：</b>JPEG &nbsp; <b>容量：</b>低 &nbsp; <b>可检测性：</b>最低<br><i>当保密性最重要且载荷较小时的最佳选择。</i></html>
gui.tooltip.dhEmbed.algo.Adaptive = <html><b>Adaptive（PNG）</b><br>将嵌入引导至变化剧烈、内容繁杂的像素处，使改动最难被察觉，同时保持输出无损。<br><br><b>格式：</b>PNG &nbsp; <b>容量：</b>中等 &nbsp; <b>可检测性：</b>低<br><i>最安全的无损方案——强有力的通用默认选择。</i></html>
gui.tooltip.dhEmbed.algo.RandomLSBMatch = <html><b>LSB 匹配（PNG）</b><br>将载荷随机分散到各个像素中，通过对数值加一或减一来设置最低位，而不是直接覆盖它——比普通 LSB 更难检测。<br><br><b>格式：</b>PNG &nbsp; <b>容量：</b>高 &nbsp; <b>可检测性：</b>中等<br><i>在容量与隐蔽性之间取得良好平衡。</i></html>
gui.tooltip.dhEmbed.algo.RandomLSB = <html><b>随机 LSB（PNG）</b><br>在图像中以密码为种子的伪随机位置覆盖最低有效位。<br><br><b>格式：</b>PNG &nbsp; <b>容量：</b>高 &nbsp; <b>可检测性：</b>较高<br><i>适用于需要容纳大载荷、且不太在意可检测性的场景。</i></html>
gui.tooltip.dhEmbed.algo.LSB = <html><b>LSB（PNG）</b><br>经典的顺序最低有效位嵌入。简单且高容量，但最容易被检测出来。<br><br><b>格式：</b>PNG &nbsp; <b>容量：</b>最高 &nbsp; <b>可检测性：</b>最高<br><i>旧版/兼容性选项——追求真正的保密性时请选择其他算法。</i></html>
gui.tooltip.dhEmbed.algo.WavLSB = <html><b>WAV LSB（音频）</b><br>将数据隐藏在未压缩 WAV 文件每个整数 PCM 采样的最低有效位中。输出是格式相同的 WAV，仍可正常播放。<br><br><b>格式：</b>WAV（无损 PCM） &nbsp; <b>容量：</b>高 &nbsp; <b>可检测性：</b>较高<br><i>用于在音频中隐藏数据。有损格式（MP3、AAC）无法承载 LSB 数据。</i></html>
