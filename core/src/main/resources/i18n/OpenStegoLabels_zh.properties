# Labels for command line interface
cmd.usage = @app.name@ 是一款提供两种功能的隐写工具：\n\
\  1. 数据隐藏：可以将任意数据隐藏在一个图像文件中。\n\
\  2. 数字水印：为图像文件添加不可见的签名水印，可用于检测未经授权的\n\
\     文件复制。\n\
\n\
图形界面：\n\
\  neostego\n\
\n\
命令行界面：\n\
\  neostego <command> [options]\n\
\n\
第一个参数必须是命令。有效的命令包括：\n\
\n\
\  embed, --embed                将消息嵌入到载体文件中\n\
\  extract, --extract            从隐写文件中提取消息\n\
\  gensig, --gensig              生成用于水印的签名\n\
\  embedmark, --embedmark        使用签名为载体文件添加水印\n\
\  checkmark, --checkmark        检查文件中是否存在水印\n\
\  algorithms, --algorithms      列出支持的隐写算法\n\
\  readformats --readformats     列出支持的载体文件格式\n\
\  writeformats, --writeformats  列出支持的隐写文件格式\n\
\  help, --help                  显示此帮助。要获取某个算法专属选项的\n\
\                                帮助，请使用 ''-a'' 选项指定该算法的\n\
\                                名称\n\
\n\
以下选项对除 ''algorithms'' 以外的所有命令都通用：\n\
\n\
\    -a, --algorithm <algorithm_name>\n\
\        要使用的隐写算法名称。可通过 ''algorithms'' 命令获取支持的\n\
\        算法列表\n\
\n\
''embed'' 选项：\n\
\n\
\    -mf, --messagefile <filename>\n\
\        源消息/数据文件。如果未提供此选项，或提供的值为 ''-''\n\
\        （不含引号），则会从标准输入读取消息数据\n\
\n\
\    -cf, --coverfile <filename>\n\
\        用于嵌入消息的载体文件。该选项支持文件名中使用 ''*'' 和 ''?''\n\
\        通配符。若使用通配符表达式，请确保用双引号将其包裹起来。\n\
\        也可以用 '';''（分号）分隔来提供多个文件名。\n\
\        如果通配符表达式匹配到多个文件，则会忽略 ''-sf''\n\
\        选项，每个载体文件都会被对应生成的隐写文件覆盖\n\
\n\
\    -sf, --stegofile <filename>\n\
\        包含嵌入消息的输出隐写文件。如果未提供此选项，或提供的值为\n\
\        ''-''（不含引号），则隐写文件会写入标准输出\n\
\n\
\    -c, --compress\n\
\        在嵌入前压缩消息文件（默认）\n\
\n\
\    -C, --nocompress\n\
\        在嵌入前不压缩消息文件\n\
\n\
\    -e, --encrypt\n\
\        在嵌入前加密消息文件\n\
\n\
\    -E, --noencrypt\n\
\        在嵌入前不加密消息文件（默认）\n\
\n\
\    -p, --password <password>\n\
\        用于加密的密码。如果未提供，则会显示提示以供输入\n\
\n\
\    -A, --cryptalgo <crypto algorithm>\n\
\        用于加密的算法。默认为 AES128。可用值为 AES128 或 AES256。\n\
\        请注意，AES256 仅在 JRE 安装了无限强度授权策略时才受支持\n\
\n\
\    -S, --split\n\
\        将一条消息拆分到所有给定的载体文件中，而不是把同一条消息嵌入\n\
\        每个文件。请通过 ''-cf''（以 '';'' 分隔）提供至少两个载体文件，\n\
\        并将 ''-sf'' 指定为一个目录；每个载体对应的隐写文件会写入该\n\
\        目录。提取时使用相同的 ''-S'' 选项\n\
\n\
''extract'' 选项：\n\
\n\
\    -sf, --stegofile <filename>\n\
\        包含嵌入消息的隐写文件。使用 ''-S''（拆分）时，请用 '';''\n\
\        分隔提供所有隐写部分\n\
\n\
\    -S, --split\n\
\        重新组合使用 ''embed -S'' 选项拆分到多个载体中的消息。请通过\n\
\        ''-sf''（以 '';'' 分隔）列出所有隐写部分\n\
\n\
\    -xf, --extractfile <filename>\n\
\        提取数据的可选文件名。用于覆盖隐写文件中嵌入的文件名\n\
\n\
\    -xd, --extractdir <dir>\n\
\        提取消息文件所在的目录。如果未提供此选项，则文件会被提取到\n\
\        当前目录\n\
\n\
\    -p, --password <password>\n\
\        用于解密的密码。如果未提供（且消息已加密），则会显示提示\n\
\        以供输入\n\
\n\
''gensig'' 选项：\n\
\n\
\    -gf, --sigfile <filename>\n\
\        可用于给文件添加水印的输出签名文件。如果未提供此选项，或\n\
\        提供的值为 ''-''（不含引号），则签名文件会写入标准输出\n\
\n\
\    -p, --password <password>\n\
\        用于生成签名的密码。如果未提供，则会显示提示以供输入\n\
\n\
''embedmark'' 选项：\n\
\n\
\    -gf, --sigfile <filename>\n\
\        水印签名文件。如果未提供此选项，或提供的值为 ''-''\n\
\        （不含引号），则会从标准输入读取签名数据\n\
\n\
\    -cf, --coverfile <filename>\n\
\        需要添加数字水印的载体文件。该选项支持文件名中使用 ''*''\n\
\        和 ''?'' 通配符。若使用通配符表达式，请确保用双引号将其\n\
\        包裹起来。也可以用 '';''（分号）分隔来提供多个文件名。\n\
\        如果通配符表达式匹配到多个文件，则会忽略 ''-sf'' 选项，\n\
\        每个载体文件都会被对应生成的隐写文件覆盖\n\
\n\
\    -sf, --stegofile <filename>\n\
\        包含嵌入水印的输出隐写文件。如果未提供此选项，或提供的值为\n\
\        ''-''（不含引号），则隐写文件会写入标准输出\n\
\n\
''checkmark'' 选项：\n\
\n\
\    -sf, --stegofile <filename>\n\
\        包含嵌入水印的隐写文件\n\
\n\
\    -gf, --sigfile <filename>\n\
\        用于给文件添加水印的签名文件\n\
\n\
示例：\n\
\n\
\  将 secret.txt 隐藏到 wallpaper.png 中并生成输出文件 test.png：\n\
\n\
\      neostego embed -a RandomLSB -mf secret.txt \\\n\
\        -cf wallpaper.png -sf test.png\n\
\   或者\n\
\      neostego --embed --algorithm=RandomLSB \\\n\
\        --messagefile=secret.txt --coverfile=wallpaper.png --stegofile=test.png\n\
\n\
\  从 test.png 中提取嵌入的数据到 /data 目录：\n\
\n\
\      neostego extract -a RandomLSB -sf test.png -xd /data\n\
\   或者\n\
\      neostego extract --algorithm=RandomLSB \\\n\
\        --stegofile=test.png --extractdir=/data\n\
\n\
\  生成签名文件：\n\
\n\
\      neostego gensig -a DWTSVD -gf my.sig\n\
\   或者\n\
\      neostego --gensig --algorithm=DWTSVD \\\n\
\        --sigfile=my.sig\n\
\n\
\  将签名嵌入到 owned.png 中并生成输出文件 out.png：\n\
\n\
\      neostego embedmark -a DWTSVD -gf my.sig \\\n\
\        -cf owned.png -sf out.png\n\
\   或者\n\
\      neostego --embedmark --algorithm=DWTSVD \\\n\
\        --sigfile=my.sig --coverfile=owned.png --stegofile=out.png\n\
\n\
\  使用 my.sig 签名文件检查 test.png 中是否存在水印：\n\
\n\
\      neostego checkmark -a DWTSVD -gf my.sig \\\n\
\        -sf test.png\n\
\   或者\n\
\      neostego checkmark --algorithm=DWTSVD \\\n\
\        --sigfile=my.sig --stegofile=test.png\n\
\n\
\  管道示例：\n\
\n\
\      ls -R | neostego embed -a RandomLSB > test.png\n\
\n\
\  通配符示例（请注意双引号很重要）：\n\
\n\
\      neostego embed -a RandomLSB \\\n\
\        -cf \"img???.png;wall*.png\" -mf watermark.txt

