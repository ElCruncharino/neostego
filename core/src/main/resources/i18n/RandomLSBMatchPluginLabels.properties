######## Resource bundle for labels used by Random LSB Matching Plugin ########

plugin.description = Image based steganography plugin using Random LSB matching (+/-1) algorithm, which is more resistant to statistical steganalysis than plain LSB

# Labels for command line interface
plugin.usage = Random LSB Matching (RandomLSBMatch) Plugin for NeoStego.\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
This plugin embeds data by adding or subtracting one from a color channel value to set the\n\
least-significant bit, instead of overwriting it. This avoids the statistical artifacts that\n\
detection tools (RS, Sample-Pair, Chi-square analysis) use to detect plain LSB steganography.\n\
Data is always embedded using a single bit per color channel.\n\
\n\
\  It affects the existing NeoStego options in the following way:\n\
\n\
\    -cf, --coverfile <filename>\n\
\        If this option is not provided or ''-'' (without quotes) is provided as\n\
\        the value then a random image containing noise is generated and used\n\
\        as cover file.\n\
\n\
\    -sf, --stegofile <filename>\n\
\        If this option is not provided or ''-'' (without quotes) is provided as\n\
\        the value then stego file is written to stdout in PNG format
