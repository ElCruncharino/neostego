######## Resource bundle for labels used by LSB Plugin ########
######## (Japanese)

plugin.description = ランダムな色データの最下位ビットを使用する画像用ステガノグラフィプラグイン

# Labels for command line interface
plugin.usage = NeoStego用ランダムな色データの最下位ビット「RandomLSB」アルゴリズム\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
NeoStego用RandomLSBアルゴリズム特定のオプション：\n\
\n\
「embed」コマンドのオプション：\n\
\n\
\    -b, --maxBitsUsedPerChannel <数>\n\
\        データを埋め込む際に画像の各色チャンネルで使用する最大ビット数。\n\
\        画像のサイズがデータを格納するのに不足している場合、画質を\n\
\        犠牲にしてこの値を増やすことができます（デフォルト \= {0}）\n\
\n\
\  これは既存のNeoStegoオプションにも次のように影響します：\n\
\n\
\    -cf, --coverfile <ファイル名>\n\
\        このオプションを指定しないか、値として''-''（引用符なし）を指定した\n\
\        場合、ノイズを含むランダムな画像が生成され、カバーファイルとして\n\
\        使用されます。画像のサイズは、''maxBitsUsedPerChannel''ビットを\n\
\        各色チャンネルで使用した場合に、指定されたソースファイルを埋め込む\n\
\        ために必要な最小サイズになります\n\
\n\
\    -sf, --stegofile <ファイル名>\n\
\        このオプションを指定しないか、値として''-''（引用符なし）を指定した\n\
\        場合、ステゴファイルは標準出力にPNG形式で書き込まれます
