######## Resource bundle for labels used by DWT-SVD Watermarking Plugin ########
######## (Chinese Simplified)

plugin.description = 使用 DWT-SVD 结合 QIM 与 Reed-Solomon 纠错的鲁棒盲数字水印插件

# Error messages
err.cover.missing = 未提供载体文件
err.signature.invalid = 签名文件无效
err.file.too.small = 图像过小，无法嵌入水印

# Labels for command line interface
plugin.usage = NeoStego 鲁棒数字水印插件（DWT-SVD）。\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
该插件通过对图像亮度分量一级 DWT 近似子带的 8x8 分块量化其最大奇异值，\n\
嵌入盲提取的多比特鲁棒水印。载荷经 Reed-Solomon 纠错保护并分散嵌入整幅\n\
图像，因此无需原始图像即可提取水印，并能在 JPEG 重新压缩、噪声、模糊及\n\
轻度缩放后依然存活。
