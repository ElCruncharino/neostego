######## Resource bundle for labels of the F5 JPEG plugin ########

plugin.description = F5 JPEG steganography (Westfeld, 2001), ported from Secret Space Encryptor. Embeds directly into an already-compressed JPEG cover: it permutes the quantized DCT coefficients with a password-seeded Blake2b PRNG and uses (1,n,k) matrix encoding to hide each bit with minimal coefficient changes, always shrinking magnitude toward zero. Fast and well established, but a fixed (non-adaptive) embedder, so more detectable than SI-UNIWARD; good for small payloads on JPEG covers.

err.image.read = Error reading the embedded data
err.image.insufficientSize = Image size not enough to embed the data
err.jpeg.invalid = Malformed or unsupported JPEG stream
err.cover.required = F5 requires a JPEG cover image

plugin.usage = F5 (F5) Plugin for NeoStego.\n\
\n\
\  Takes an existing JPEG cover and hides data in its quantized DCT coefficients\n\
\  using the classic F5 algorithm (matrix encoding + password-seeded permutation).\n\
\  The cover JPEG's own quantization tables are reused on re-encode, so there is no\n\
\  quality option. Capacity depends on the cover's nonzero AC coefficients; F5 is a\n\
\  fixed embedder and less stealthy than the SI-UNIWARD plugin, but fast and a good\n\
\  fit for small payloads when only a compressed JPEG is available as cover.
