######## Resource bundle for labels used by Random LSB Matching Plugin ########
######## (Chinese Simplified)

plugin.description = 使用随机 LSB 匹配（±1）算法的图像隐写插件，比普通 LSB 更能抵御统计隐写分析

# Labels for command line interface
plugin.usage = NeoStego 随机 LSB 匹配（RandomLSBMatch）插件。\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
该插件通过对颜色通道值加一或减一来设置最低有效位，而不是直接覆盖它，\n\
从而嵌入数据。这样可以避免检测工具（RS 分析、Sample-Pair 分析、卡方\n\
分析）用来识别普通 LSB 隐写的统计特征。数据总是按每个颜色通道一位的\n\
方式嵌入。\n\
\n\
\  它会以如下方式影响现有的 NeoStego 选项：\n\
\n\
\    -cf, --coverfile <filename>\n\
\        如果未提供此选项，或提供的值为 ''-''（不含引号），则会生成一张\n\
\        包含噪声的随机图像并用作载体文件。\n\
\n\
\    -sf, --stegofile <filename>\n\
\        如果未提供此选项，或提供的值为 ''-''（不含引号），则隐写文件会\n\
\        以 PNG 格式写入标准输出。
