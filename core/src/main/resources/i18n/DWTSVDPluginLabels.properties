######## Resource bundle for labels used by DWT-SVD Watermarking Plugin ########

plugin.description = Robust blind digital watermarking using DWT-SVD with QIM and Reed-Solomon error correction

# Error messages
err.cover.missing = Cover file is not provided
err.signature.invalid = Signature file is invalid
err.file.too.small = Image is too small to embed the watermark

# Labels for command line interface
plugin.usage = Robust digital watermarking plugin (DWT-SVD) for NeoStego.\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
This plugin embeds a blind, multi-bit, robust watermark by quantizing the largest\n\
singular value of 8x8 blocks of the level-1 DWT approximation sub-band of the image\n\
luminance. The payload is protected with Reed-Solomon error correction and spread\n\
across the image, so the watermark can be recovered without the original image and\n\
survives JPEG re-compression, noise, blurring and mild scaling.
