######## Resource bundle for labels used by the WAV LSB audio plugin ########
######## (Chinese Simplified)

plugin.description = 在 WAV（PCM）采样最低有效位中隐藏数据的音频隐写插件

# Labels for command line interface
plugin.usage = NeoStego WAV LSB（WavLSB）音频插件。\n\
Copyright (c) @time.year@ @author.name@\n\
\n\
将消息隐藏在未压缩 WAV 载体每个整数 PCM 采样的最低有效位中。输出是\n\
格式相同的 WAV 文件，仍可正常播放。仅支持无损 PCM WAV，有损/压缩音频\n\
（MP3、AAC、Ogg 等）无法承载隐藏数据，因为编解码器会丢弃消息所依赖的\n\
低位细节。压缩和加密选项的工作方式与图像插件相同。\n\
\n\
\    -cf, --coverfile <filename.wav>\n\
\        用于嵌入消息的 WAV 载体。\n\
\    -sf, --stegofile <filename.wav>\n\
\        携带隐藏消息的输出 WAV。

# Error messages
err.audio.insufficientSize = WAV 载体太小，无法容纳数据。请使用更长的音频片段或更小（或已压缩）的载荷。
err.audio.invalidWav = 无效或不受支持的音频文件：不是 RIFF/WAVE 容器
err.audio.unsupportedFormat = 不受支持的 WAV 格式：仅支持未压缩的整数 PCM
err.audio.noCoverFile = 嵌入操作需要一个 WAV 载体文件
err.audio.read = 从音频文件读取嵌入数据时出错
