######## Resource bundle for labels used by Random LSB Matching Plugin ########
######## (Japanese)

plugin.description = ランダムLSBマッチング（±1）アルゴリズムを使用した画像用ステガノグラフィプラグイン。通常のLSBより統計的解析への耐性が高い

# Labels for command line interface
plugin.usage = NeoStego用ランダムLSBマッチング（RandomLSBMatch）プラグイン。\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
このプラグインは、最下位ビットを上書きする代わりに、色チャンネルの値に1を\n\
加算または減算することで最下位ビットを設定し、データを埋め込みます。これに\n\
より、検出ツール（RS分析、Sample-Pair分析、カイ二乗分析）が通常のLSB\n\
ステガノグラフィを検出するために利用する統計的な痕跡を回避します。データは\n\
常に色チャンネルごとに1ビットで埋め込まれます。\n\
\n\
\  これは既存のNeoStegoオプションに次のように影響します:\n\
\n\
\    -cf, --coverfile <ファイル名>\n\
\        このオプションを指定しない、または値として''-''（引用符なし）を\n\
\        指定した場合、ノイズを含むランダム画像が生成され、載体ファイルとして\n\
\        使用されます。\n\
\n\
\    -sf, --stegofile <ファイル名>\n\
\        このオプションを指定しない、または値として''-''（引用符なし）を\n\
\        指定した場合、ステゴファイルはPNG形式で標準出力に書き込まれます。
