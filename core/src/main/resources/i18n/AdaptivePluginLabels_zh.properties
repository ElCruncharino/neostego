######## Resource bundle for labels of the content-adaptive (HILL+STC) plugin ########
######## (Chinese Simplified)

plugin.description = 基于内容自适应（HILL 代价函数 + 校验子网格码 STC）的图像隐写算法。将极少量的 ±1 修改集中在纹理复杂、难以察觉的区域，能同时抵御统计分析和基于机器学习的隐写分析。

err.image.read = 读取图像数据时出错
err.image.insufficientSize = 图像尺寸不足以嵌入数据

plugin.usage = NeoStego 内容自适应（Adaptive）插件。\n\
\n\
\  使用基于 HILL 代价、经 STC 编码的 ±1 嵌入方式隐藏数据。修改会被放置在\n\
\  图像中最复杂、最难被检测的区域，并通过编码让尽可能少的样本携带载荷。\n\
\  为了安全起见，载荷被稀疏分散，因此容量低于普通 LSB。该算法没有额外的选项。

# Labels for GUI
gui.label.option.advanced = 高级选项
gui.label.option.cmd = 聚类修改（CMD）
gui.label.option.cmdMu = 聚类强度（mu）
