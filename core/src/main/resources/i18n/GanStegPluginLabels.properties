######## Resource bundle for labels of the experimental GAN steganography plugin ########

plugin.description = Experimental GAN-based steganography (SteganoGAN "dense" architecture, run locally through ONNX Runtime). The encoder/decoder were trained end-to-end against a steganalysis discriminator, so pixel changes are shaped to be harder to detect than a fixed rule like LSB. The network has a real per-bit error rate, so the message is Reed-Solomon protected and tiled redundantly across the cover; message size is capped small and a larger cover improves reliability rather than capacity.

err.cover.required = GAN plugin requires a cover image
err.message.tooLong = Message (with header) is too long for this plugin's fixed error-correction block
err.image.tooSmall = Cover image is too small to hold even one error-correction block
err.decode.failed = No copy of the embedded block survived error correction
err.model.unavailable = Could not load the ONNX Runtime or the bundled GAN model

plugin.usage = GAN (GAN) Plugin for NeoStego [experimental].\n\
\n\
\  Hides data using a pretrained GAN steganography network (SteganoGAN "dense"),\n\
\  run locally through ONNX Runtime, instead of a fixed embedding rule. Pixel\n\
\  changes are shaped by adversarial training against a steganalysis discriminator,\n\
\  aiming for lower detectability than LSB-style plugins at equivalent payload size.\n\
\  The network's own decode is not bit-perfect, so the message is Reed-Solomon\n\
\  protected and tiled across the whole cover, with a majority vote at extraction\n\
\  time; a larger cover mainly buys reliability. Message size is capped at a small\n\
\  fixed budget ({0} bytes, header included) regardless of cover size -- this is a\n\
\  research plugin for short messages, not a bulk data channel.
