######## Resource bundle for labels used by DWT-SVD Watermarking Plugin ########
######## (Japanese)

plugin.description = QIMとリード・ソロモン誤り訂正を用いたDWT-SVDによる頑健なブラインド電子透かしプラグイン

# Error messages
err.cover.missing = 載体ファイルが指定されていません
err.signature.invalid = 署名ファイルが無効です
err.file.too.small = 画像が小さすぎて電子透かしを埋め込めません

# Labels for command line interface
plugin.usage = NeoStego用頑健電子透かしプラグイン（DWT-SVD）。\n\
Copyright (c) 2007-@time.year@ @author.name@\n\
\n\
このプラグインは、画像輝度のレベル1DWT近似サブバンドを8x8ブロックに分割し、\n\
その最大特異値を量子化することで、ブラインド・マルチビットの頑健な電子透かしを\n\
埋め込みます。ペイロードはリード・ソロモン誤り訂正で保護され、画像全体に分散\n\
されるため、原画像なしで電子透かしを復元でき、JPEG再圧縮、ノイズ、ぼかし、\n\
軽度の拡大縮小にも耐えます。
