# Detailed hover descriptions for each algorithm (HTML, shown as tooltips on the dropdown)
gui.tooltip.dhEmbed.algo.JpegUniward = <html><b>SI-UNIWARD (JPEG)</b><br>Content-adaptive embedding that hides data in JPEG coefficients, concentrating changes in noisy, hard-to-model regions.<br><br><b>Format:</b> JPEG &nbsp; <b>Capacity:</b> low &nbsp; <b>Detectability:</b> lowest<br><i>Best when secrecy matters most and the payload is small.</i></html>
gui.tooltip.dhEmbed.algo.Adaptive = <html><b>Adaptive (PNG)</b><br>Steers embedding toward busy, high-variance pixels where changes are hardest to detect, while keeping output lossless.<br><br><b>Format:</b> PNG &nbsp; <b>Capacity:</b> moderate &nbsp; <b>Detectability:</b> low<br><i>The most secure lossless option — a strong general-purpose default.</i></html>
gui.tooltip.dhEmbed.algo.RandomLSBMatch = <html><b>LSB matching (PNG)</b><br>Randomly spreads the payload across pixels, incrementing/decrementing values rather than overwriting the last bit — harder to detect than plain LSB.<br><br><b>Format:</b> PNG &nbsp; <b>Capacity:</b> high &nbsp; <b>Detectability:</b> moderate<br><i>Good balance of capacity and stealth.</i></html>
gui.tooltip.dhEmbed.algo.RandomLSB = <html><b>Random LSB (PNG)</b><br>Overwrites least-significant bits at pseudo-random, password-seeded positions across the image.<br><br><b>Format:</b> PNG &nbsp; <b>Capacity:</b> high &nbsp; <b>Detectability:</b> higher<br><i>Use when you need to fit a large payload and detectability is less of a concern.</i></html>
gui.tooltip.dhEmbed.algo.LSB = <html><b>LSB (PNG)</b><br>Classic sequential least-significant-bit embedding. Simple and high-capacity, but the easiest to detect.<br><br><b>Format:</b> PNG &nbsp; <b>Capacity:</b> highest &nbsp; <b>Detectability:</b> highest<br><i>Legacy/compatibility option — prefer the others for real secrecy.</i></html>
gui.tooltip.dhEmbed.algo.WavLSB = <html><b>WAV LSB (audio)</b><br>Hides data in the least-significant bit of each integer PCM sample of an uncompressed WAV. Output is a same-format WAV that still plays normally.<br><br><b>Format:</b> WAV (lossless PCM) &nbsp; <b>Capacity:</b> high &nbsp; <b>Detectability:</b> higher<br><i>For hiding data in audio. Lossy formats (MP3, AAC) cannot carry LSB data.</i></html>
