/*
 * NeoStego desktop UI built with Compose Multiplatform (Desktop), on the toolkit-agnostic :core.
 * GPU-rendered (smooth resizing) and accessibility-conscious; the Swing :desktop UI is retained as
 * the screen-reader-accessible fallback. Covers data hiding (Hide/Extract) and digital watermarking
 * (generate signature / embed / verify).
 */

import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'org.jetbrains.compose' version '1.11.1'
}

repositories {
    mavenCentral()
    google()
    maven { url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
}

dependencies {
    implementation project(':core')
    // INTERIM: depend on :desktop for its AWT/ImageIO raster codec (AwtImageCodec + ImageUtil),
    // registered via ServiceLoader — without it the image plugins report no readable/writable formats
    // and image embeds fail. This also pulls in the Swing UI/FlatLaf transitively, which we don't use.
    // Phase 5 (retire Swing) will split the desktop-platform support (codec, image util, preferences)
    // into a shared module so this can become a clean dependency.
    implementation project(':desktop')
    implementation compose.desktop.currentOs
    implementation compose.material3
    implementation compose.materialIconsExtended

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}

// Expose the project version to the app at runtime (for the About screen) without hardcoding it:
// filter @version@ in the bundled neostego-version.txt at processResources time (config-cache safe).
def appVersion = project.version.toString()
tasks.named('processResources') {
    filesMatching('neostego-version.txt') {
        filter(ReplaceTokens, tokens: [version: appVersion])
    }
}

compose.desktop {
    application {
        mainClass = 'com.elcruncharino.neostego.compose.MainKt'
    }
}

// Build an executable jar whose manifest names the unified launcher and lists every runtime dependency
// on its Class-Path (resolved against the flat lib/app/ dir jpackage lays the input into). Named
// distinctly from :desktop's neostego.jar (which we depend on) to avoid a filename clash in the bundle.
jar {
    archiveFileName = 'neostego-app.jar'
    manifest {
        attributes(
                'Main-Class'            : 'com.elcruncharino.neostego.compose.MainKt',
                'Implementation-Version': project.version,
                'Built-By'              : project.author,
                'Class-Path'            : configurations.runtimeClasspath.collect { it.name }.join(' '),
        )
    }
}

// Native installer (jpackage) for the Compose app — the primary NeoStego desktop binary. Points
// at the unified Compose launcher (Compose UI by default; --classic/--accessible → the Swing
// fallback; other args → CLI); reuses the same resource-dir conventions (branded icon, themed
// .desktop with an Accessible-mode menu action, the rpm .spec with the %preun upgrade guard, and
// the /usr/bin/neostego CLI symlink). See gradle/jpackage.gradle for the shared task definitions,
// which :desktop also uses.
ext {
    jpackageAppName            = 'NeoStego'
    jpackageMainJar             = 'neostego-app.jar'
    jpackageMainClass           = 'com.elcruncharino.neostego.compose.MainKt'
    // Reuse :desktop's branded Windows icon (jpackage.gradle also reuses its win-upgrade-uuid, so
    // the Compose .msi upgrades any installed Swing-era NeoStego in place).
    jpackageIconFile            = rootProject.file('desktop/src/main/dist/neostego.ico').absolutePath
    jpackageMsiDesc             = 'Build a runtime-bundled Windows .msi of the Compose app (Swing/CLI fallback included).'
    jpackageDmgDesc             = 'Build a runtime-bundled macOS .dmg of the Compose app (Swing/CLI fallback included).'
    jpackageDebDesc             = 'Build a runtime-bundled Linux .deb of the Compose app (Swing/CLI fallback included).'
    jpackageRpmDesc             = 'Build a runtime-bundled Linux .rpm of the Compose app (Swing/CLI fallback included).'
    // Which JDK provides jpackage (and thus the bundled runtime + native launcher). Defaults to
    // JAVA_HOME, but JPACKAGE_HOME can point at a newer JDK — e.g. on openSUSE Tumbleweed the JDK
    // 21 launcher's C++ teardown aborts ("pure virtual method called" in libapplauncher during
    // _dl_fini); JDK 25's launcher doesn't, so build the local installer with
    // JPACKAGE_HOME=/usr/lib64/jvm/java-25-openjdk-25.
    jpackageUseJpackageHomeEnv  = true
    // Optionally bundle a pre-built runtime image instead of letting jpackage jlink one. Needed
    // when the jpackage JDK can't jlink (e.g. openSUSE's JDK 25 ships no jmods): set
    // JPACKAGE_RUNTIME_IMAGE to a JDK/JRE dir. Leave unset on CI (JDK 21 there jlinks a minimal
    // runtime, and its launcher is fine on mainstream distros). Pairs with
    // JPACKAGE_HOME=…/java-25-openjdk-25 for the abort-free launcher.
    jpackageSupportRuntimeImage = true
}
apply from: "$rootDir/gradle/jpackage.gradle"

// Format the Kotlin in this module (the root Spotless config only covers Java).
spotless {
    kotlin {
        target 'src/**/*.kt'
        ktlint('1.5.0').editorConfigOverride([
                'ktlint_standard_no-wildcard-imports'    : 'disabled',
                'ktlint_standard_function-naming'        : 'disabled',
                'max_line_length'                        : 'off',
        ])
        trimTrailingWhitespace()
        endWithNewline()
    }
}
