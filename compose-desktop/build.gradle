/*
 * NeoStego desktop UI built with Compose Multiplatform (Desktop), on the toolkit-agnostic :core.
 * GPU-rendered (smooth resizing) and accessibility-conscious; the Swing :desktop UI is retained as
 * the screen-reader-accessible fallback. Covers data hiding (Hide/Extract) and digital watermarking
 * (generate signature / embed / verify).
 */

import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'org.jetbrains.compose' version '1.11.1'
}

repositories {
    mavenCentral()
    google()
    maven { url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
}

dependencies {
    implementation project(':core')
    // INTERIM: depend on :desktop for its AWT/ImageIO raster codec (AwtImageCodec + ImageUtil),
    // registered via ServiceLoader — without it the image plugins report no readable/writable formats
    // and image embeds fail. This also pulls in the Swing UI/FlatLaf transitively, which we don't use.
    // Phase 5 (retire Swing) will split the desktop-platform support (codec, image util, preferences)
    // into a shared module so this can become a clean dependency.
    implementation project(':desktop')
    implementation compose.desktop.currentOs
    implementation compose.material3
    implementation compose.materialIconsExtended

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}

// Expose the project version to the app at runtime (for the About screen) without hardcoding it:
// filter @version@ in the bundled neostego-version.txt at processResources time (config-cache safe).
def appVersion = project.version.toString()
tasks.named('processResources') {
    filesMatching('neostego-version.txt') {
        filter(ReplaceTokens, tokens: [version: appVersion])
    }
}

compose.desktop {
    application {
        mainClass = 'com.elcruncharino.neostego.compose.MainKt'
    }
}
