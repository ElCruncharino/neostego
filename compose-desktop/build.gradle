/*
 * NeoStego desktop UI built with Compose Multiplatform (Desktop), on the toolkit-agnostic :core.
 * GPU-rendered (smooth resizing) and accessibility-conscious; the Swing :desktop UI is retained as
 * the screen-reader-accessible fallback. Covers data hiding (Hide/Extract) and digital watermarking
 * (generate signature / embed / verify).
 */

import org.apache.tools.ant.filters.ReplaceTokens
import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'org.jetbrains.compose' version '1.11.1'
}

repositories {
    mavenCentral()
    google()
    maven { url = 'https://maven.pkg.jetbrains.space/public/p/compose/dev' }
}

dependencies {
    implementation project(':core')
    // INTERIM: depend on :desktop for its AWT/ImageIO raster codec (AwtImageCodec + ImageUtil),
    // registered via ServiceLoader — without it the image plugins report no readable/writable formats
    // and image embeds fail. This also pulls in the Swing UI/FlatLaf transitively, which we don't use.
    // Phase 5 (retire Swing) will split the desktop-platform support (codec, image util, preferences)
    // into a shared module so this can become a clean dependency.
    implementation project(':desktop')
    implementation compose.desktop.currentOs
    implementation compose.material3
    implementation compose.materialIconsExtended

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}

// Expose the project version to the app at runtime (for the About screen) without hardcoding it:
// filter @version@ in the bundled neostego-version.txt at processResources time (config-cache safe).
def appVersion = project.version.toString()
tasks.named('processResources') {
    filesMatching('neostego-version.txt') {
        filter(ReplaceTokens, tokens: [version: appVersion])
    }
}

compose.desktop {
    application {
        mainClass = 'com.elcruncharino.neostego.compose.MainKt'
    }
}

// Build an executable jar whose manifest names the unified launcher and lists every runtime dependency
// on its Class-Path (resolved against the flat lib/app/ dir jpackage lays the input into). Named
// distinctly from :desktop's neostego.jar (which we depend on) to avoid a filename clash in the bundle.
jar {
    archiveFileName = 'neostego-app.jar'
    manifest {
        attributes(
                'Main-Class'            : 'com.elcruncharino.neostego.compose.MainKt',
                'Implementation-Version': project.version,
                'Built-By'              : project.author,
                'Class-Path'            : configurations.runtimeClasspath.collect { it.name }.join(' '),
        )
    }
}

// ---------------------------------------------------------------------------------------
// Native installer (jpackage) for the Compose app — the primary NeoStego desktop binary.
// Mirrors :desktop's jpackage setup but points at the unified Compose launcher (Compose UI by
// default; --classic/--accessible → the Swing fallback; other args → CLI). Reuses the same
// resource-dir conventions (branded icon, themed .desktop with an Accessible-mode menu action, the
// rpm .spec with the %preun upgrade guard, and the /usr/bin/neostego CLI symlink).
// ---------------------------------------------------------------------------------------
def projectName = 'NeoStego'
def jpackageInputDir = layout.buildDirectory.dir('jpackage/input')
def jpackageOutDir = layout.buildDirectory.dir('jpackage/out')
// jpackage requires a strictly numeric version (e.g. 1.0.0); drop any -SNAPSHOT/-rc suffix.
def jpackageVersion = project.version.toString().replaceAll(/-.*$/, '')

// Which JDK provides jpackage (and thus the bundled runtime + native launcher). Defaults to JAVA_HOME,
// but JPACKAGE_HOME can point at a newer JDK — e.g. on openSUSE Tumbleweed the JDK 21 launcher's C++
// teardown aborts ("pure virtual method called" in libapplauncher during _dl_fini); JDK 25's launcher
// doesn't, so build the local installer with JPACKAGE_HOME=/usr/lib64/jvm/java-25-openjdk-25.
def jpackageBin = {
    String jh = System.getenv('JPACKAGE_HOME') ?: System.getenv('JAVA_HOME')
    String exe = Os.isFamily(Os.FAMILY_WINDOWS) ? 'jpackage.exe' : 'jpackage'
    jh ? new File(jh, "bin/${exe}").absolutePath : exe
}

tasks.register('jpackageInput', Copy) {
    dependsOn jar
    into jpackageInputDir
    // Main jar plus all runtime deps (incl. :desktop's neostego.jar and the Skia/Compose libs), flat,
    // so the jar manifest's Class-Path (filenames) resolves.
    from(tasks.jar)
    from(configurations.runtimeClasspath)
    // Ship the scalable logo inside the app image (lib/app/) so the Linux packages can register it
    // in the FreeDesktop icon theme at install time (see the resource-dir .spec/postinst).
    from('artifacts/neostego.svg')
}

// jpackage metadata resolved to plain strings here (the argumentProviders closures run at execution
// time, where referencing the Gradle 'project' object is forbidden by the configuration cache).
def jpVendor = project.author.toString()
def jpCopyright = "Copyright (c) Samir Vaidya and ${project.author}".toString()
def jpAboutUrl = project.homepageUrl.toString()
def jpLicenseFile = rootProject.file('LICENSE').absolutePath
def jpDebMaintainer = project.authorMail.toString()
// Reuse :desktop's branded Windows icon and the SAME UpgradeCode, so the Compose .msi upgrades any
// installed Swing-era NeoStego in place (jpackage would otherwise generate a random code per build).
def jpIconFile = rootProject.file('desktop/src/main/dist/neostego.ico').absolutePath
def jpWinUpgradeUuid = 'b4fc0612-03d7-498f-8331-8d8cc780f728'
def jpLinuxResourceDir = file('artifacts/jpackage/linux').absolutePath
// XRender smooths Swing-on-XWayland resizing for the --classic fallback; Compose (Skia/GPU) ignores it.
def jpLinuxJavaOptions = ['--java-options', '-Dsun.java2d.xrender=true']

// Optionally bundle a pre-built runtime image instead of letting jpackage jlink one. Needed when the
// jpackage JDK can't jlink (e.g. openSUSE's JDK 25 ships no jmods): set JPACKAGE_RUNTIME_IMAGE to a
// JDK/JRE dir. Leave unset on CI (JDK 21 there jlinks a minimal runtime, and its launcher is fine on
// mainstream distros). Pairs with JPACKAGE_HOME=…/java-25-openjdk-25 for the abort-free launcher.
def jpackageRuntimeImage = System.getenv('JPACKAGE_RUNTIME_IMAGE')

def commonJpackageArgs = {
    def a = [
            '--name'        , projectName,
            '--app-version' , jpackageVersion,
            '--vendor'      , jpVendor,
            '--copyright'   , jpCopyright,
            '--about-url'   , jpAboutUrl,
            '--input'       , jpackageInputDir.get().asFile.absolutePath,
            '--main-jar'    , 'neostego-app.jar',
            '--main-class'  , 'com.elcruncharino.neostego.compose.MainKt',
            '--license-file', jpLicenseFile,
            '--dest'        , jpackageOutDir.get().asFile.absolutePath,
    ]
    if (jpackageRuntimeImage) {
        a += ['--runtime-image', jpackageRuntimeImage]
    }
    a
}

tasks.register('jpackageMsi', Exec) {
    group = 'distribution'
    description = 'Build a runtime-bundled Windows .msi of the Compose app (Swing/CLI fallback included).'
    dependsOn jpackageInput
    onlyIf { Os.isFamily(Os.FAMILY_WINDOWS) }
    doFirst { jpackageOutDir.get().asFile.mkdirs() }
    executable jpackageBin()
    argumentProviders.add({
        commonJpackageArgs() + [
                '--type', 'msi',
                '--icon', jpIconFile,
                '--win-menu', '--win-menu-group', projectName,
                '--win-shortcut', '--win-per-user-install',
                '--win-upgrade-uuid', jpWinUpgradeUuid,
        ]
    } as CommandLineArgumentProvider)
}

tasks.register('jpackageDmg', Exec) {
    group = 'distribution'
    description = 'Build a runtime-bundled macOS .dmg of the Compose app (Swing/CLI fallback included).'
    dependsOn jpackageInput
    onlyIf { Os.isFamily(Os.FAMILY_MAC) }
    doFirst { jpackageOutDir.get().asFile.mkdirs() }
    executable jpackageBin()
    argumentProviders.add({
        commonJpackageArgs() + ['--type', 'dmg', '--mac-package-name', projectName]
    } as CommandLineArgumentProvider)
}

tasks.register('jpackageRpm', Exec) {
    group = 'distribution'
    description = 'Build a runtime-bundled Linux .rpm of the Compose app (Swing/CLI fallback included).'
    dependsOn jpackageInput
    onlyIf { Os.isFamily(Os.FAMILY_UNIX) && !Os.isFamily(Os.FAMILY_MAC) }
    doFirst { jpackageOutDir.get().asFile.mkdirs() }
    executable jpackageBin()
    argumentProviders.add({
        commonJpackageArgs() + jpLinuxJavaOptions + [
                '--type', 'rpm',
                '--resource-dir', jpLinuxResourceDir,
                '--linux-shortcut', '--linux-menu-group', 'Utility',
                '--linux-rpm-license-type', 'GPLv2',
        ]
    } as CommandLineArgumentProvider)
}

tasks.register('jpackageDeb', Exec) {
    group = 'distribution'
    description = 'Build a runtime-bundled Linux .deb of the Compose app (Swing/CLI fallback included).'
    dependsOn jpackageInput
    onlyIf { Os.isFamily(Os.FAMILY_UNIX) && !Os.isFamily(Os.FAMILY_MAC) }
    doFirst { jpackageOutDir.get().asFile.mkdirs() }
    executable jpackageBin()
    argumentProviders.add({
        commonJpackageArgs() + jpLinuxJavaOptions + [
                '--type', 'deb',
                '--resource-dir', jpLinuxResourceDir,
                '--linux-shortcut', '--linux-menu-group', 'Utility',
                '--linux-deb-maintainer', jpDebMaintainer,
        ]
    } as CommandLineArgumentProvider)
}

tasks.register('jpackage') {
    group = 'distribution'
    description = 'Build the native runtime-bundled installer(s) for the current OS.'
    dependsOn jpackageMsi, jpackageDmg, jpackageRpm, jpackageDeb
}

// Format the Kotlin in this module (the root Spotless config only covers Java).
spotless {
    kotlin {
        target 'src/**/*.kt'
        ktlint('1.5.0').editorConfigOverride([
                'ktlint_standard_no-wildcard-imports'    : 'disabled',
                'ktlint_standard_function-naming'        : 'disabled',
                'max_line_length'                        : 'off',
        ])
        trimTrailingWhitespace()
        endWithNewline()
    }
}
