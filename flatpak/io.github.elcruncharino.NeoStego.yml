app-id: io.github.elcruncharino.NeoStego
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: neostego

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Swing's file chooser needs direct filesystem access (it does not use the portal).
  - --filesystem=home

modules:
  - name: neostego
    buildsystem: simple
    build-commands:
      # Unpack the released Debian package (it bundles a Java runtime via jpackage).
      - ar x neostego_1.0.0_amd64.deb
      - tar -xaf data.tar.zst
      - cp -a opt/neostego /app/neostego
      - install -Dm755 neostego-launcher.sh /app/bin/neostego
      - install -Dm644 io.github.elcruncharino.NeoStego.svg
        /app/share/icons/hicolor/scalable/apps/io.github.elcruncharino.NeoStego.svg
      - install -Dm644 io.github.elcruncharino.NeoStego.desktop
        /app/share/applications/io.github.elcruncharino.NeoStego.desktop
      - install -Dm644 io.github.elcruncharino.NeoStego.metainfo.xml
        /app/share/metainfo/io.github.elcruncharino.NeoStego.metainfo.xml
    sources:
      - type: file
        url: https://github.com/ElCruncharino/neostego/releases/download/v1.0.0/neostego_1.0.0_amd64.deb
        sha256: e161856f205f0e86d23ea420d3f63b23deaf90e9bd8c966bd6b7b55fc1cfbc21
      - type: file
        path: neostego-launcher.sh
      - type: file
        path: io.github.elcruncharino.NeoStego.svg
      - type: file
        path: io.github.elcruncharino.NeoStego.desktop
      - type: file
        path: io.github.elcruncharino.NeoStego.metainfo.xml
