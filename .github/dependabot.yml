version: 2
updates:
  # Java/Kotlin dependencies (FlatLaf, picocli, TwelveMonkeys, AndroidX/Compose, test libs)
  - package-ecosystem: "gradle"
    directories:
      - "/desktop"
      - "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Keep the CI/release GitHub Actions current (checkout, setup-java, upload/download-artifact, gh-release)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
