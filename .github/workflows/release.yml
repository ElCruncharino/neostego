name: Release

# Build runtime-bundled native installers (and a signed Android APK) on each OS and attach
# them to a GitHub Release. Push a tag like v1.0.0 to cut a release; or run manually
# (workflow_dispatch) to test the desktop build without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            tasks: ':desktop:jpackageExe'
            artifacts: desktop/build/jpackage/out/*.exe
          - name: macos-arm64
            os: macos-latest
            tasks: ':desktop:jpackageDmg'
            artifacts: desktop/build/jpackage/out/*.dmg
          - name: linux-x64
            os: ubuntu-latest
            tasks: ':desktop:jpackageDeb :desktop:jpackageRpm :desktop:distBin'
            artifacts: |
              desktop/build/jpackage/out/*.deb
              desktop/build/jpackage/out/*.rpm
              desktop/build/distributions/*.zip
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Inno Setup (Windows .exe)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Install rpm/deb tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot binutils

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "arg=-Pversion=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer(s)
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} ${{ steps.ver.outputs.arg }} --no-daemon --console=plain

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  android:
    name: android-apk
    runs-on: ubuntu-latest
    # Only build the APK for real releases (needs signing secrets); skip on dispatch dry-runs.
    if: github.ref_type == 'tag'
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Check for signing key
        id: signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set; skipping APK (an unsigned APK cannot be installed)."
          fi

      - name: Materialize keystore
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          SP: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SP" "$KA" "$KP" > android/keystore.properties

      - name: Build signed APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          ./gradlew :android:assembleRelease -Pversion=${GITHUB_REF_NAME#v} --no-daemon --console=plain
          apk=$(ls android/build/outputs/apk/release/*.apk | grep -v -- '-unsigned' | head -1)
          echo "Packaging APK: $apk"
          cp "$apk" "NeoStego-${GITHUB_REF_NAME#v}.apk"

      - name: Upload APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: NeoStego-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release (draft pre-release)
        uses: softprops/action-gh-release@v2
        with:
          name: NeoStego ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: dist/**/*
