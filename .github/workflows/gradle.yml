# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

  cli-compliance:
    name: CLI / shell compliance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Lint the launcher script (shellcheck is preinstalled on ubuntu runners)
      run: shellcheck desktop/src/main/dist/neostego.sh
    - name: Build the CLI distribution
      run: ./gradlew :desktop:distBase --no-daemon
    - name: Install bats
      run: git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
    - name: Run CLI compliance tests
      run: "$RUNNER_TEMP/bats/bin/bats desktop/src/test/bats/cli.bats"
